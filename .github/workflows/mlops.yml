name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # JOB 1: Chạy unit tests trên dữ liệu ảo (không cần GCS)
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  # JOB 2: Huấn luyện mô hình trên dữ liệu thực, upload artifact lên cloud storage
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Pull data with DVC
        run: dvc pull


      - name: Train model
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          python -c "import json; m=json.load(open('outputs/metrics.json')); print(f'accuracy={m[\"accuracy\"]}')" >> $GITHUB_OUTPUT

      - name: Upload model to Cloud Storage
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage

          bucket_name = os.environ.get("CLOUD_BUCKET", "").strip() or "track2-day21-thangngu"
          client = storage.Client()
          bucket = client.bucket(bucket_name)
          blob = bucket.blob("models/latest/model.pkl")
          blob.upload_from_filename("models/model.pkl")
          print(f"Model uploaded to GCS bucket {bucket_name} successfully.")
          EOF


      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: outputs/metrics.json

  # JOB 3: Kiểm tra chất lượng - chỉ cho phép deploy khi accuracy >= 0.70
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check eval gate
        env:
          ACCURACY: ${{ needs.train.outputs.accuracy }}
        run: |
          python - <<'EOF'
          import os
          import sys

          acc = float(os.environ["ACCURACY"])
          print(f"Current model accuracy: {acc:.4f}")
          if acc < 0.70:
              print(f"Eval gate failed: accuracy {acc:.4f} < 0.70 threshold.")
              sys.exit(1)
          else:
              print(f"Eval gate passed: accuracy {acc:.4f} >= 0.70 threshold.")
          EOF

  # JOB 4: Triển khai sau khi eval gate qua
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM via SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          host="${VM_HOST:-34.67.46.157}"
          user="${VM_USER:-Admin}"

          mkdir -p ~/.ssh
          echo "$VM_SSH_KEY" > ~/.ssh/id_ed25519
          if [ ! -s ~/.ssh/id_ed25519 ] || ! grep -q "BEGIN OPENSSH PRIVATE KEY" ~/.ssh/id_ed25519; then
            cat << 'EOF' > ~/.ssh/id_ed25519
            -----BEGIN OPENSSH PRIVATE KEY-----
            b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
            QyNTUxOQAAACBbkvFTVytkHjIiO1qNgXzuRzi2zfu6T4/zPhOKrBDToAAAAJj98+Ja/fPi
            WgAAAAtzc2gtZWQyNTUxOQAAACBbkvFTVytkHjIiO1qNgXzuRzi2zfu6T4/zPhOKrBDToA
            AAAECsla1yPbzIHF+3Ab6IDa8/XMnpUfB+UjAWC61JKUjLzluS8VNXK2QeMiI7Wo2BfO5H
            OLbN+7pPj/M+E4qsENOgAAAAFWdpdGh1Yi1hY3Rpb25zLWRlcGxveQ==
            -----END OPENSSH PRIVATE KEY-----
            EOF
          fi
          chmod 600 ~/.ssh/id_ed25519

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${user}@${host}" "sudo systemctl restart mlops-serve && sleep 5 && curl -f http://localhost:8000/health"


