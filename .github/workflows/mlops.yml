name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # JOB 1: Chạy unit tests trên dữ liệu ảo (không cần GCS)
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  # JOB 2: Huấn luyện mô hình trên dữ liệu thực, upload artifact lên cloud storage
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Pull data with DVC
        run: dvc pull

      - name: Train model (Bonus 3: Performance Report & Bonus 5: Drift Check)
        run: python src/train.py

      - name: Read metrics
        id: read_metrics
        run: |
          python -c "import json; m=json.load(open('outputs/metrics.json')); print(f'accuracy={m[\"accuracy\"]}')" >> $GITHUB_OUTPUT

      - name: Upload model and metrics to Cloud Storage
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage

          bucket_name = os.environ.get("CLOUD_BUCKET", "").strip() or "track2-day21-thangngu"
          client = storage.Client()
          bucket = client.bucket(bucket_name)

          # Upload model.pkl
          blob_model = bucket.blob("models/latest/model.pkl")
          blob_model.upload_from_filename("models/model.pkl")
          print("Uploaded models/latest/model.pkl to GCS.")

          # Upload metrics.json cho Bonus 4 (So sánh với lần chạy trước)
          blob_metrics = bucket.blob("models/latest/metrics.json")
          blob_metrics.upload_from_filename("outputs/metrics.json")
          print("Uploaded models/latest/metrics.json to GCS.")
          EOF

      - name: Save performance report & metrics as artifact (Bonus 3)
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: |
            outputs/metrics.json
            outputs/report.txt

  # JOB 3: Kiểm tra chất lượng (Bonus 4: Hoàn trả phiên bản nếu accuracy giảm)
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        run: |
          echo '${{ secrets.CLOUD_CREDENTIALS }}' > /tmp/sa-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Check eval gate & regression (Bonus 4)
        env:
          NEW_ACCURACY: ${{ needs.train.outputs.accuracy }}
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}
        run: |
          python - <<'EOF'
          import os
          import sys
          import json
          from google.cloud import storage

          new_acc = float(os.environ["NEW_ACCURACY"])
          bucket_name = os.environ.get("CLOUD_BUCKET", "").strip() or "track2-day21-thangngu"

          # 1. Tải metrics.json cũ từ GCS (nếu có)
          old_acc = 0.0
          try:
              client = storage.Client()
              bucket = client.bucket(bucket_name)
              blob = bucket.blob("models/latest/metrics.json")
              if blob.exists():
                  blob.download_to_filename("/tmp/old_metrics.json")
                  with open("/tmp/old_metrics.json") as f:
                      old_data = json.load(f)
                      old_acc = float(old_data.get("accuracy", 0.0))
                  print(f"Loaded previous model accuracy from GCS: {old_acc:.4f}")
              else:
                  print("No previous metrics.json found on GCS.")
          except Exception as e:
              print(f"Notice: Could not load previous metrics from GCS: {e}")

          print(f"\n=== EVALUATION COMPARISON ===")
          print(f"New model accuracy      : {new_acc:.4f}")
          print(f"Previous model accuracy : {old_acc:.4f}")
          print(f"Accuracy Threshold      : 0.7000")

          # 2. Kiểm tra ngưỡng tối thiểu 0.70
          if new_acc < 0.70:
              print(f"\n[FAIL] Eval gate failed: accuracy {new_acc:.4f} < 0.70 threshold.")
              sys.exit(1)

          # 3. BONUS 4: So sánh với model cũ (Ngăn chặn Regression)
          if old_acc > 0 and new_acc < old_acc:
              print(f"\n[FAIL] BONUS 4 REGRESSION CHECK FAILED: New accuracy ({new_acc:.4f}) < Previous accuracy ({old_acc:.4f}). Cancelling deployment to prevent model regression!")
              sys.exit(1)

          print(f"\n[PASS] BONUS 4 PASSED: New accuracy ({new_acc:.4f}) >= Previous accuracy ({old_acc:.4f}) and >= 0.70 threshold. Proceeding to deploy!")
          EOF

  # JOB 4: Triển khai sau khi eval gate qua
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM via SSH
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "$VM_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          user=$(echo "${VM_USER}" | tr -d '\r\n" ' | xargs)
          host=$(echo "${VM_HOST}" | tr -d '\r\n" ' | xargs)
          user="${user:-Admin}"
          host="${host:-34.67.46.157}"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${user}@${host}" 'sudo systemctl restart mlops-serve && for i in $(seq 1 10); do if curl -s http://localhost:8000/health | grep -q "ok"; then echo "Server is healthy!"; exit 0; fi; echo "Waiting for server... ($i/10)"; sleep 3; done; echo "Timeout waiting for server"; exit 1'
